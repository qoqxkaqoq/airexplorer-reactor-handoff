name: typediag
on:
  workflow_dispatch:
    inputs:
      exe:
        required: false
        default: 'v30'
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: run
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $cand = "exes\AirExplorer_${{ inputs.exe }}.exe"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ci\typediag.ps1 -Exe $cand 2>&1 | Tee-Object -FilePath out\typediag.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typediag
          path: out/
