name: UI Probe

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "仓库内候选 exe 路径"
        required: true
        default: "exes/AirExplorer_staticmerge.exe"
      wait:
        description: "等待秒数"
        required: false
        default: "35"
  push:
    branches: ["main", "work"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 准备运行目录 (官方安装包 + 覆盖候选 exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cand = "${{ github.event.inputs.candidate }}"
          if ([string]::IsNullOrWhiteSpace($cand)) { $cand = "exes/AirExplorer_staticmerge.exe" }
          Write-Host "candidate = $cand"
          Invoke-WebRequest -Uri "https://www.airexplorer.net/downloads/AirExplorer-OnlineInstaller.exe" -OutFile ae_installer.exe
          & "C:\Program Files\7-Zip\7z.exe" x -y -oapp ae_installer.exe | Out-Null
          if (-not (Test-Path "app\AirExplorer.exe")) { throw "installer extract failed" }
          Copy-Item -LiteralPath $cand -Destination "app\AirExplorer.exe" -Force
          Get-ChildItem app | Select-Object Name,Length | Format-Table | Out-String | Write-Host
          Write-Host "md5 = $((Get-FileHash 'app\AirExplorer.exe' -Algorithm MD5).Hash)"
          "# candidate: $cand  md5: $((Get-FileHash 'app\AirExplorer.exe' -Algorithm MD5).Hash)" | Out-File -Encoding utf8 app/_candidate.txt

      - name: UI 探针
        shell: pwsh
        run: |
          $w = "${{ github.event.inputs.wait }}"
          if ([string]::IsNullOrWhiteSpace($w)) { $w = "35" }
          ./tools/ci/probe.ps1 -ExePath "app\AirExplorer.exe" -WaitSec $w -OutDir probe

      - name: 受控宿主重跑 (抓异常堆栈)
        if: always()
        shell: pwsh
        run: |
          # 重编译 host.cs (v2: 异常落盘 + ThreadException)
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:tools\ci\host.exe /r:System.Windows.Forms.dll tools\ci\host.cs
          $env:COMPLUS_ReadyToRun = "0"
          $env:COMPlus_JitNoInline = "1"
          # JIT 反汇编序列: 崩溃前最后成功 JIT 的方法 = 定位失败点的关键
          $env:COMPLUS_JitDisasm = "*"
          $env:COMPLUS_JitDiffableDasm = "1"
          $hp = Start-Process -FilePath "tools\ci\host.exe" -ArgumentList "AirExplorer.exe" -WorkingDirectory "app" -PassThru -RedirectStandardOutput "probe\host_stdout.txt" -RedirectStandardError "probe\host_stderr.txt" -NoNewWindow
          $deadline = (Get-Date).AddSeconds(25)
          while ((Get-Date) -lt $deadline -and -not $hp.HasExited) { Start-Sleep -Milliseconds 500 }
          if (-not $hp.HasExited) { try { $hp.Kill() } catch {} ; "host still running (UI alive) - killed" | Out-File -Append -Encoding utf8 "probe\host_stdout.txt" }
          else { "host exit code: $($hp.ExitCode)" | Out-File -Append -Encoding utf8 "probe\host_stdout.txt" }
          Get-Content "probe\host_stdout.txt" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }

      - name: 收集日志
        if: always()
        shell: pwsh
        run: |
          Copy-Item app/_candidate.txt probe/ -Force -ErrorAction SilentlyContinue
          Get-Content probe/probe.log -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-probe
          path: probe
          retention-days: 7

      - name: 回传结果到 ci-results 分支
        if: always()
        shell: pwsh
        run: |
          git config user.email "ci@local"
          git config user.name "ci"
          New-Item -ItemType Directory -Force -Path "results/$env:GITHUB_RUN_ID" | Out-Null
          Copy-Item app/host_trace.txt probe/host_trace.txt -Force -ErrorAction SilentlyContinue
          Copy-Item probe/* "results/$env:GITHUB_RUN_ID/" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item app/_candidate.txt "results/$env:GITHUB_RUN_ID/" -Force -ErrorAction SilentlyContinue
          git checkout -B ci-results
          git add -f results
          git commit -m "probe run $env:GITHUB_RUN_ID (${{ github.event.inputs.candidate }})" -q
          git push -f origin "HEAD:refs/heads/ci-$env:GITHUB_RUN_ID"
