name: Unpacker M-gate

# 脱壳机流水线门禁: ubuntu 构建 + S1..Sn 产物, windows-latest 跑隔离探针 + 长稳。
# VERDICT 判定只认 ci/probe.ps1 输出 (probe.log VERDICT 行) 与 soak exit code。

on:
  workflow_dispatch:
    inputs:
      stages:
        description: "流水线阶段 (如 s1 / s1-s4 / full)"
        required: false
        default: "s1"
      only_tokens:
        description: "可选: 只注入此文件里的 token(对分定位), 路径相对仓库根"
        required: false
        default: ""
  push:
    branches: ["a1work"]
    paths:
      - "tools3/unpacker/**"

permissions:
  contents: write

jobs:
  build-unpacker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup dotnet 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build unpacker
        run: |
          cd tools3/unpacker
          dotnet build -c Release AirExplorerUnpacker.csproj

      - name: Run pipeline (S1)
        env:
          ONLY_TOKENS: ${{ github.event.inputs.only_tokens }}
        run: |
          cd tools3/unpacker
          EXTRA=()
          if [ -n "$ONLY_TOKENS" ]; then EXTRA=(--only "../../$ONLY_TOKENS"); fi
          dotnet bin/Release/net8.0/AirExplorerUnpacker.dll s1 \
            ../../work_a1_pack/nrs/AirExplorer_test_Slayed.exe \
            ../../work_a1_pack/memdump/module_text.bin \
            ../../work/c2_pack/bodies_manifest.tsv \
            ../../work/dump_official_16598.zip \
            out/m1_s1_full.exe \
            --baseline ../../exes/AirExplorer_baseline_verified.exe "${EXTRA[@]}"
          ls -la out/
          cat out/s1_report.txt

      - name: Upload unpacked exe
        uses: actions/upload-artifact@v4
        with:
          name: unpacked-exe
          path: |
            tools3/unpacker/out/m1_s1_full.exe
            tools3/unpacker/out/s1_report.txt
          retention-days: 14

  probe-windows:
    runs-on: windows-2025
    needs: build-unpacker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download unpacked exe
        uses: actions/download-artifact@v4
        with:
          name: unpacked-exe
          path: cand

      - name: 准备运行目录 (候选 exe + 官方依赖)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path app | Out-Null
          if (-not (Test-Path "cand\m1_s1_full.exe")) { throw "unpacked exe missing" }
          Copy-Item cand\m1_s1_full.exe app\AirExplorer.exe -Force
          & "C:\Program Files\7-Zip\7z.exe" x -y -oapp portable/deps.zip | Out-Null
          if (-not (Test-Path "app\BouncyCastle.Crypto.dll")) { throw "deps extract failed" }
          $md5 = (Get-FileHash 'app\AirExplorer.exe' -Algorithm MD5).Hash
          Write-Host "candidate md5 = $md5"
          Get-ChildItem app | Measure-Object | ForEach-Object { Write-Host ("app files: " + $_.Count) }
          "# unpacker M1 candidate md5: $md5" | Out-File -Encoding utf8 app/_candidate.txt

      - name: 隔离探针 (probe_iso, WaitSec=100)
        shell: pwsh
        run: ./ci/probe_iso.ps1 -ExePath "app\AirExplorer.exe" -WaitSec 100 -OutDir probe

      - name: 隔离长稳 (soak_iso, 7min) — 探针 PASS 才跑
        id: soak
        if: ${{ success() }}
        shell: pwsh
        run: |
          $v = Select-String -Path probe\probe.log -Pattern "VERDICT\s*=\s*(\S+)" | Select-Object -First 1
          $verdict = if ($v) { $v.Matches[0].Groups[1].Value } else { "UNKNOWN" }
          Write-Host "probe verdict = $verdict"
          if ($verdict -ne "PASS") {
            Write-Host "::warning::probe verdict=$verdict, skip soak (M1 死法分类阶段)"
            "run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          "run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          ./ci/soak_iso.ps1 -ExePath "app\AirExplorer.exe" -Minutes 7

      - name: 反射加载诊断（抓 LoaderExceptions 精确成员）
        if: always()
        shell: pwsh
        run: |
          $code = @'
          using System;
          using System.Reflection;
          public static class LoadDiag {
            public static void Run(string path) {
              var asm = Assembly.LoadFrom(path);
              try { var ts = asm.GetTypes(); Console.WriteLine("[diag] GetTypes OK: " + ts.Length); }
              catch (ReflectionTypeLoadException ex) {
                int ok = 0; foreach (var t in ex.Types) if (t != null) ok++;
                Console.WriteLine("[diag] GetTypes FAIL: " + ok + "/" + ex.Types.Length);
                int n = 0;
                foreach (var le in ex.LoaderExceptions) {
                  if (n >= 30) break;
                  n++;
                  Console.WriteLine("  LOADER: " + le.GetType().Name + ": " + le.Message + (le.InnerException != null ? " || INNER: " + le.InnerException.Message : ""));
                }
              }
            }
          }
          '@
          Add-Type -TypeDefinition $code
          [LoadDiag]::Run((Resolve-Path "app\AirExplorer.exe").Path)

      - name: ILVerify 静态验证（诊断用, 不作门禁）
        if: always()
        shell: pwsh
        run: |
          dotnet tool install -g dotnet-ilverify --version 8.0.0 2>$null | Out-Null
          $iv = "$env:USERPROFILE\.dotnet\ilverify.exe"
          if (-not (Test-Path $iv)) { Write-Host "ilverify not installed, skip"; exit 0 }
          $refs = @()
          $refs += "--reference"
          $refs += "exes\AirExplorer_baseline_verified.exe"
          Get-ChildItem "app\*.dll" | ForEach-Object { $refs += "--reference"; $refs += $_.FullName }
          & $iv cand\m1_s1_full.exe @refs 2>&1 | Out-File -Encoding utf8 ilverify.log
          Write-Host "ilverify errors: $((Select-String -Path ilverify.log -Pattern '\[IL\]: Error').Count)"
          Get-Content ilverify.log -TotalCount 5

      - name: 收集结果
        if: always()
        shell: pwsh
        run: |
          Get-Content probe\probe.log -ErrorAction SilentlyContinue
          Copy-Item cand\s1_report.txt probe\s1_report.txt -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m-gate-probe
          path: |
            probe
            ilverify.log
            app/_candidate.txt
          retention-days: 14

      - name: 回传结果到 ci-results 分支
        if: always()
        shell: pwsh
        run: |
          git config user.email "ci@local"
          git config user.name "ci"
          New-Item -ItemType Directory -Force -Path "results/m-gate-$env:GITHUB_RUN_ID" | Out-Null
          Copy-Item probe\* "results/m-gate-$env:GITHUB_RUN_ID/" -Recurse -Force -ErrorAction SilentlyContinue
          git add -f results
          git commit -m "m-gate run $env:GITHUB_RUN_ID (M1 S1 probe)" -q --allow-empty
          git push -f origin "HEAD:refs/heads/ci-results"
