name: Dump Stack
# 卡死诊断: 启动候选 → CPU 满转时 windbg attach → SOS 抓托管栈 → 定位卡死方法
on:
  workflow_dispatch:
    inputs:
      exe:
        description: '候选短名(如 v106)'
        required: true
        default: 'v106'
      wait:
        description: '启动后等待秒数'
        required: false
        default: '20'

jobs:
  dump:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 下载 WinDbg(aka.ms → prss CDN, 复用 TTD 管线已验证姿势)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\out | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/windbg/download" -OutFile D:\windbg.appinstaller
          $xml = [xml](Get-Content D:\windbg.appinstaller -Raw)
          $bundleUri = $xml.AppInstaller.MainBundle.Uri
          Write-Host "bundle = $bundleUri"
          Invoke-WebRequest -Uri $bundleUri -OutFile D:\windbg.msixbundle
          New-Item -ItemType Directory -Force -Path D:\wd | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x -y -oD:\wd D:\windbg.msixbundle | Out-Null
          $pkg = Get-ChildItem D:\wd -Filter "*.msix" | Select-Object -First 1
          if ($pkg) { & "C:\Program Files\7-Zip\7z.exe" x -y "-oD:\wd\x" $pkg.FullName | Out-Null }
          $cdb = Get-ChildItem -Recurse D:\wd -Filter "cdb.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $cdb) { Get-ChildItem -Recurse D:\wd -Filter "*.exe" | Select-Object -First 10 | ForEach-Object { Write-Host $_.FullName }; exit 1 }
          Write-Host "cdb = $cdb"
          "CDb=$cdb" | Add-Content $env:GITHUB_ENV

      - name: 解压候选并落位
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.airexplorer.net/downloads/AirExplorer-OnlineInstaller.exe" -OutFile ae_installer.exe
          & "C:\Program Files\7-Zip\7z.exe" x -y -oapp ae_installer.exe | Out-Null
          if (-not (Test-Path "app\AirExplorer.exe")) { Write-Host "extract failed"; exit 1 }
          Copy-Item "exes\AirExplorer_${{ inputs.exe }}.exe" app\AirExplorer.exe -Force
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:app\host.exe /r:System.Windows.Forms.dll tools\ci\host.cs
          if ($LASTEXITCODE -ne 0) { Write-Host "HOST COMPILE FAILED"; exit 1 }
          Copy-Item app\host.exe C:\out\host_used.exe

      - name: cdb -o 跟随启动 + 延时抓栈(托管+原生)
        shell: pwsh
        run: |
          # cdb -o: 调试器跟随 host.exe 拉起的子进程(AirExplorer); initial break 后 load sos,
          # .sleep 等运行, 再抓全部线程托管栈
          Set-Location app
          & $env:CDb -o -y "srv*C:\symbols*https://msdl.microsoft.com/download/symbols" `
            -c ".loadby sos clr; .sleep ${{ inputs.wait }}000; .echo ===CLRSTACK===; ~*e !clrstack; .echo ===NATIVE===; ~*k 40; qd" `
            host.exe AirExplorer.exe 2>&1 | Tee-Object -FilePath C:\out\stacks.log | Select-Object -Last 50
          Write-Host "=== done ==="

      - name: 线程 CPU 记录
        if: always()
        shell: pwsh
        run: |
          $tgt = Get-Process -Name "AirExplorer" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($tgt) { $tgt.Threads | Sort-Object -Property TotalProcessorTime -Descending | Select-Object -First 6 | ForEach-Object { Write-Host ("thread " + $_.Id + " cpu=" + $_.TotalProcessorTime) } | Out-File C:\out\threads.txt }
          else { Write-Host "AirExplorer already exited" | Out-File C:\out\threads.txt }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stackdump
          path: C:\out\
