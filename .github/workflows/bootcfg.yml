name: bootcfg-probe
# 复现真机"有配置"启动路径: 官方跑一次生成默认配置 → 用该配置分别启动 官方/v139 对比
# 若 v139(有配置) 卡死/无窗而官方秒开 → cdb attach 抓全线程托管栈定位撞桩点
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: '对比对象 exe（默认 v139）'
        required: false
        default: 'exes/AirExplorer_v139.exe'

jobs:
  bootcfg:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 下载解包 WinDbg(cdb)
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri "https://aka.ms/windbg/download" -OutFile D:\windbg.appinstaller
          $xml = [xml](Get-Content D:\windbg.appinstaller -Raw)
          $bundleUri = $xml.AppInstaller.MainBundle.Uri
          Write-Host "bundle = $bundleUri"
          Invoke-WebRequest -Uri $bundleUri -OutFile D:\windbg.msixbundle
          New-Item -ItemType Directory -Force -Path D:\wd | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" x -y -oD:\wd D:\windbg.msixbundle | Out-Null
          $pkg = Get-ChildItem D:\wd -Filter "*.msix" | Select-Object -First 1
          if ($pkg) { & "C:\Program Files\7-Zip\7z.exe" x -y "-oD:\wd\x" $pkg.FullName | Out-Null }
          $cdb = @("D:\wd\x\amd64\cdb.exe", "D:\wd\amd64\cdb.exe", "D:\wd\cdb.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          Write-Host "cdb = $cdb"
          if (-not $cdb) { Get-ChildItem -Recurse D:\wd -Filter "cdb.exe" | Select-Object -First 3 | ForEach-Object { Write-Host $_.FullName }; exit 1 }
          Set-Content -Path D:\wd\cdb.txt -Value $cdb.FullName

      - name: 官方安装包解压
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\out | Out-Null
          Invoke-WebRequest -Uri "https://www.airexplorer.net/downloads/AirExplorer-OnlineInstaller.exe" -OutFile ae_installer.exe
          & "C:\Program Files\7-Zip\7z.exe" x -y -oapp ae_installer.exe | Out-Null
          if (-not (Test-Path "app\AirExplorer.exe")) { throw "extract failed" }

      - name: 第1步 官方跑 60s 生成默认配置
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $p = Start-Process -FilePath "app\AirExplorer.exe" -WorkingDirectory "app" -PassThru
          Start-Sleep -Seconds 60
          if (-not $p.HasExited) { $p.Kill(); Start-Sleep -Seconds 3 }
          Get-ChildItem "$env:APPDATA\AirExplorer" -ErrorAction SilentlyContinue | Format-Table Name,Length | Out-String | Write-Host
          if (Test-Path "$env:APPDATA\AirExplorer\airexplorer.xml") {
            Copy-Item "$env:APPDATA\AirExplorer\airexplorer.xml" C:\out\seed_airexplorer.xml
            Write-Host "SEED-OK"
          } else {
            Write-Host "官方未生成 airexplorer.xml，列出实际生成的内容:"; Get-ChildItem "$env:APPDATA\AirExplorer" -Recurse -ErrorAction SilentlyContinue | Format-Table FullName,Length | Out-String | Write-Host
          }

      - name: 第2步 清配置 → 官方(带种子配置)启动 45s（并抓官方 3s 主窗体创建栈）
        shell: pwsh
        run: |
          Remove-Item "$env:APPDATA\AirExplorer" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\AirExplorer" | Out-Null
          Copy-Item C:\out\seed_airexplorer.xml "$env:APPDATA\AirExplorer\airexplorer.xml" -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Procdump.zip" -OutFile D:\pd.zip
          & "C:\Program Files\7-Zip\7z.exe" x -y -oD:\pd D:\pd.zip | Out-Null
          $cdb = @("D:\wd\x\amd64\cdb.exe", "D:\wd\amd64\cdb.exe", "D:\wd\cdb.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          $sym = "srv*C:\symbols*https://msdl.microsoft.com/download/symbols"
          $p = Start-Process -FilePath "app\AirExplorer.exe" -WorkingDirectory "app" -PassThru
          Start-Sleep -Seconds 2
          & D:\pd\procdump64.exe -accepteula -ma $p.Id C:\out\official_2s.dmp 2>&1 | Select-Object -Last 2
          & $cdb -z C:\out\official_2s.dmp -y $sym -c ".load C:\Windows\Microsoft.NET\Framework64\v4.0.30319\sos.dll; !clrstack; q" 2>&1 | Tee-Object -FilePath C:\out\official_2s_stacks.log | Select-Object -Last 40
          if (-not (Test-Path C:\out\official_2s.dmp)) { Write-Host "official 2s dump 失败，继续" }
          $t0 = Get-Date
          $shown = $false
          for ($i = 3; $i -le 45; $i += 3) {
            Start-Sleep -Seconds 3
            if ($p.HasExited) { Write-Host "OFFICIAL exited code=$($p.ExitCode)"; break }
            $wins = @(Get-Process -Id $p.Id -ErrorAction SilentlyContinue | ForEach-Object { $_.MainWindowTitle }) | Where-Object { $_ }
            if ($wins) { Write-Host ("OFFICIAL 主窗口出现于 t={0}s title={1}" -f $i, ($wins -join "|")); $shown = $true; break }
          }
          if (-not $shown -and -not $p.HasExited) { Write-Host "OFFICIAL 45s 无主窗口" }
          if (-not $p.HasExited) { $p.Kill(); Start-Sleep -Seconds 3 }
          exit 0

      - name: 第3步 换 v139 + 同一配置 → 启动 60s
        shell: pwsh
        run: |
          $cand = "${{ github.event.inputs.candidate }}"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/qoqxkaqoq/airexplorer-reactor-handoff/main/$cand" -OutFile "app\AirExplorer.exe"
          Write-Host "v139 md5 = $((Get-FileHash 'app\AirExplorer.exe' -Algorithm MD5).Hash)"
          Remove-Item "$env:APPDATA\AirExplorer" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\AirExplorer" | Out-Null
          Copy-Item C:\out\seed_airexplorer.xml "$env:APPDATA\AirExplorer\airexplorer.xml" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "app\AirExplorer.exe" -WorkingDirectory "app" -PassThru
          $shown = $false
          for ($i = 3; $i -le 60; $i += 3) {
            Start-Sleep -Seconds 3
            if ($p.HasExited) { Write-Host "V139 exited code=$($p.ExitCode)"; break }
            $wins = @(Get-Process -Id $p.Id -ErrorAction SilentlyContinue | ForEach-Object { $_.MainWindowTitle }) | Where-Object { $_ }
            if ($wins) { Write-Host ("V139 主窗口出现于 t={0}s title={1}" -f $i, ($wins -join "|")); $shown = $true; break }
          }
          if (-not $shown -and -not $p.HasExited) {
            Write-Host "V139(有配置) 60s 无主窗口 —— procdump 抓 dump → SOS 栈"
            Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Procdump.zip" -OutFile D:\pd.zip
            & "C:\Program Files\7-Zip\7z.exe" x -y -oD:\pd D:\pd.zip | Out-Null
            & D:\pd\procdump64.exe -accepteula -ma $p.Id C:\out\v139.dmp 2>&1 | Select-Object -Last 6
            Start-Sleep -Seconds 3
            if (Test-Path C:\out\v139.dmp) {
              Write-Host ("dump 大小: " + (Get-Item C:\out\v139.dmp).Length)
              # cdb 自查找(不依赖跨 step 文件传递)
              $cdb = @("D:\wd\x\amd64\cdb.exe", "D:\wd\amd64\cdb.exe", "D:\wd\cdb.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
              if (-not $cdb) { $cdb = Get-ChildItem -Recurse D:\wd -Filter "cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName }
              Write-Host "cdb 路径 = [$cdb]"
              $sym = "srv*C:\symbols*https://msdl.microsoft.com/download/symbols"
              $cmd = ".load C:\Windows\Microsoft.NET\Framework64\v4.0.30319\sos.dll; !threads; ~*e !clrstack; q"
              if ($cdb) {
                $out = & $cdb -z C:\out\v139.dmp -y $sym -c $cmd 2>&1
                $out | Tee-Object -FilePath C:\out\v139_stacks.log | Select-Object -Last 70
                Write-Host "cdb exit=$LASTEXITCODE"
              } else { Write-Host "cdb 找不到, dmp 已保留" }
            } else { Write-Host "dump 失败" }
          }
          if (-not $p.HasExited) { $p.Kill() }
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootcfg-out
          path: |
            C:\out\v139_stacks.log
            C:\out\official_2s_stacks.log
            C:\out\seed_airexplorer.xml
