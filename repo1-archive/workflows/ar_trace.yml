name: ar_trace
on:
  workflow_dispatch: {}
jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Extract app and build tracer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $work = "$env:RUNNER_TEMP\work"
          $out = "$env:RUNNER_TEMP\traceout"
          New-Item -ItemType Directory -Force -Path $work, $out | Out-Null
          $src = Join-Path $env:GITHUB_WORKSPACE "1.zip"
          Expand-Archive -Path $src -DestinationPath $work -Force
          $target = Get-ChildItem $work -Recurse -File -Filter "AirExplorer.exe" | Select-Object -First 1
          if (-not $target) { Write-Error "未找到原版"; exit 1 }
          "APP_DIR=$(Split-Path $target.FullName)" | Out-File -Append $env:GITHUB_ENV
          "ORIG_EXE=$($target.FullName)" | Out-File -Append $env:GITHUB_ENV
          Write-Host "原版: $($target.FullName)"
          "TRACE_OUT=$out" | Out-File -Append $env:GITHUB_ENV

          $nbtsrc = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          [IO.File]::WriteAllText("$out\nbtrace.cs", $nbtsrc)
          $projxml = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          [IO.File]::WriteAllText("$out\nbtrace.csproj", $projxml)
          Set-Location $out
          dotnet build nbtrace.csproj -c Release 2>&1 | Select-Object -Last 6
          $nbt = Get-ChildItem "$out\bin\Release" -Recurse -Filter "nbtrace.exe" | Select-Object -First 1
          if (-not $nbt) { Write-Error "nbtrace 构建失败"; exit 1 }
          "NBT=$($nbt.FullName)" | Out-File -Append $env:GITHUB_ENV
          Write-Host "nbtrace: $($nbt.FullName)"

      - name: Build stackdump v73 (forms 模式)
        shell: pwsh
        run: |
          $out = $env:TRACE_OUT
          $sdsrc = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          [IO.File]::WriteAllText("$out\stackdump.cs", $sdsrc)
          $csc64 = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $clrmdDll = "$env:GITHUB_WORKSPACE\bin\tools\Microsoft.Diagnostics.Runtime.dll"
          & $csc64 /nologo /t:exe /platform:x64 /out:"$out\stackdump.exe" /r:"$clrmdDll" "$out\stackdump.cs" 2>&1 | ForEach-Object { Write-Host $_ }
          Copy-Item $clrmdDll "$out\Microsoft.Diagnostics.Runtime.dll" -Force
          Write-Host "stackdump 可用: $(Test-Path "$out\stackdump.exe")"

      - name: v73 活体窗体探测 (原版 15s)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = $env:TRACE_OUT
          # 解压原版
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE" -Filter "*.zip" | Where-Object Length -gt 100KB | Select-Object -First 1
          $app = "$env:RUNNER_TEMP\\appOrig"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Expand-Archive $zip.FullName -DestinationPath $app -Force
          # 跑原版 15s
          $p = Start-Process "$app\\AirExplorer.exe" -WorkingDirectory $app -PassThru
          Start-Sleep -Seconds 15
          $alive = -not $p.HasExited
          $title = ''; try { $p.Refresh(); $title = $p.MainWindowTitle } catch {}
          Write-Host "[orig-15s] 存活=$alive 标题='$title'"
          # forms dump
          $sd = "$env:TRACE_OUT\\bin\\Release\\net48\\stackdump.exe"
          if (Test-Path $sd) {
            & $sd --forms $p.Id 2>&1 | Tee-Object -FilePath "$out\\forms.txt" | Select-Object -First 60
          } else {
            Get-ChildItem "$out" -Recurse -Filter "stackdump.exe" | ForEach-Object {
              & $_.FullName --forms $p.Id 2>&1 | Tee-Object -FilePath "$out\\forms.txt" | Select-Object -First 60
            }
          }
          if (-not (Test-Path "$out\\forms.txt")) { Write-Host "forms.txt 未产出" }
          if ($alive) { & taskkill.exe /PID $p.Id /T /F 2>&1 | Out-Null }

      - name: Run A (traced original) - skip v51
        if: false
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = $env:TRACE_OUT
          $appA = "$env:RUNNER_TEMP\appA"
          New-Item -ItemType Directory -Force -Path $appA | Out-Null
          Copy-Item "$env:APP_DIR\*" $appA -Recurse -Force
          Copy-Item "$out\orig_traced.exe" "$appA\AirExplorer.exe" -Force
          try { Add-Type -AssemblyName System.Windows.Forms } catch {}
          $p = Start-Process "$appA\AirExplorer.exe" -WorkingDirectory $appA -PassThru
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          $title = ''
          try { $p.Refresh(); $title = $p.MainWindowTitle } catch {}
          Write-Host "[A-30s] 存活=$alive 标题='$title'"
          if ($alive) { & taskkill.exe /PID $p.Id /T /F 2>&1 | Out-Null }
          Start-Sleep -Seconds 2
          if (Test-Path "$appA\orig_state_trace.log") {
            $n = (Get-Content "$appA\orig_state_trace.log" | Measure-Object -Line).Lines
            Write-Host "A 追踪行数: $n"
            Copy-Item "$appA\orig_state_trace.log" "$out\orig_trace.log" -Force
            Get-Content "$out\orig_trace.log" -TotalCount 40 | Write-Host
          } else { Write-Host "A 追踪未产出!" }

      - name: Run B (traced hybrid) - skip v51
        if: false
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = $env:TRACE_OUT
          $appB = "$env:RUNNER_TEMP\appB"
          New-Item -ItemType Directory -Force -Path $appB | Out-Null
          Copy-Item "$env:APP_DIR\*" $appB -Recurse -Force
          Copy-Item "$out\hybrid_traced.exe" "$appB\AirExplorer.exe" -Force
          try { Add-Type -AssemblyName System.Windows.Forms } catch {}
          $p = Start-Process "$appB\AirExplorer.exe" -WorkingDirectory $appB -PassThru
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          $title = ''
          try { $p.Refresh(); $title = $p.MainWindowTitle } catch {}
          Write-Host "[B-30s] 存活=$alive 标题='$title'"
          if ($alive) { & taskkill.exe /PID $p.Id /T /F 2>&1 | Out-Null }
          Start-Sleep -Seconds 2
          if (Test-Path "$appB\hybrid_state_trace.log") {
            $n = (Get-Content "$appB\hybrid_state_trace.log" | Measure-Object -Line).Lines
            Write-Host "B 追踪行数: $n"
            Copy-Item "$appB\hybrid_state_trace.log" "$out\hybrid_trace.log" -Force
            Get-Content "$out\hybrid_trace.log" -TotalCount 40 | Write-Host
            # 循环节检测: 尾部 200 行的模式
            Write-Host "=== B 尾部 30 行 ==="
            Get-Content "$out\hybrid_trace.log" -Tail 30 | Write-Host
          } else { Write-Host "B 追踪未产出!" }

      - name: Diff traces - skip v51
        if: false
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = $env:TRACE_OUT
          if ((Test-Path "$out\orig_trace.log") -and (Test-Path "$out\hybrid_trace.log")) {
            $a = Get-Content "$out\orig_trace.log"
            $b = Get-Content "$out\hybrid_trace.log"
            Write-Host "A 长度: $($a.Count)  B 长度: $($b.Count)"
            $div = -1
            $lim = [Math]::Min($a.Count, $b.Count)
            for ($i = 0; $i -lt $lim; $i++) {
              if ($a[$i] -ne $b[$i]) { $div = $i; break }
            }
            if ($div -ge 0) {
              Write-Host "=== 首个分歧 @ 行 $div ==="
              for ($j = [Math]::Max(0, $div-6); $j -lt [Math]::Min($lim, $div+6); $j++) {
                Write-Host ("A[{0}]={1}  B[{0}]={2}" -f $j, $a[$j], $b[$j])
              }
            } else { Write-Host "前 $lim 行无分歧 (B 可能为 A 前缀+循环)" }
            # B 的循环周期检测
            $tail = $b | Select-Object -Last 300
            $seq = ($tail | Select-Object -First 100) -join ','
            $hits = 0
            for ($i = 100; $i -le 200; $i++) {
              if (($tail | Select-Object -Skip $i -First 100) -join ',' -eq $seq) { $hits++ }
            }
            Write-Host "B 尾部周期命中: $hits (候选周期 1-100)"
          } else { Write-Host "对比跳过 (单侧缺)" }

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-artifacts
          path: |
            ${{ env.TRACE_OUT }}\sa_trace.log
            ${{ env.TRACE_OUT }}\searchadapter_dump.txt
            ${{ env.TRACE_OUT }}\state_trace.log.eh.txt
            ${{ env.TRACE_OUT }}\v54_traced.exe
