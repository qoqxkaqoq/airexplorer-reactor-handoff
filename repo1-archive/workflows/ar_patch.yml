# .github/workflows/ar_patch.yml
# v84: 终局交付打包 —— 按 plan.md 产出唯一交付物「脱壳后的 zip」:
#   unpacked/ (脱壳exe) + runnable/ (完整可运行程序包) + reports/ (静态报告/导入表/动态启动报告/补丁日志/截图)
#   + SHA256SUMS.txt → AirExplorer_unpacked.zip → Artifact unpacked-final
# v83c 实证: patched exe 启动即出主窗 'Air Explorer v5.11.0', 存活 45s (run 39517420436)
# v26: 探针升级 — ClrMD 1.1 挂栈(修复 v25 nuget 404 + $stackdump 未定义两 bug), 12/40s 双采样, minidump 兜底
# v21: 终验 e8runnable 交付 (窗口已证实存活)
# 证据链: v14e 诊断证实 — 原版 exe 的 VM (InstantiateStatelessUser) 也是 4 指令壳 (NecroBit 原生),
#   18KB VM 真身来自 CILantro 静态恢复 (cilantro-vm-recovery 产物 changes.json:
#   "restore-method-body 060042AC InstantiateStatelessUser<T> — grafted statically restored CIL"),
#   已入库为 bin/AirExplorer_cilantro.exe (git blob)。
#   JIT 转储恢复非确定性: 早期运行恢复了 VM, 现仓库 nb_original 恢复了 InstantiateGlobalCalculator —
#   两路产物互补, nb_original 基座 + CILantro VM 移植 = 合流架构。
# v15 补丁 (nbpatch):
#   1.【核心】批量移植: nb_original 空壳方法 ← CILantro 恢复版同名真身 (token 重映射)
#   2. 中和: DefineEfficientProfiler (原生引导挂点) + DefineActiveEvent (反调试)
#   3. InstantiateGlobalCalculator 最小字段初始化 + 可见性放行 + trace 注入
name: Patch Run Tier

on:
  workflow_dispatch:

jobs:
  patch:
    name: 定向补丁与启动验证
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract app and prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $work = "$env:RUNNER_TEMP\work"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $src = Join-Path $env:GITHUB_WORKSPACE "1.zip"
          if (-not (Test-Path $src)) { Write-Error "1.zip 不存在"; exit 1 }
          Expand-Archive -Path $src -DestinationPath $work -Force
          $target = Get-ChildItem $work -Recurse -File -Filter "AirExplorer.exe" | Select-Object -First 1
          if (-not $target) { Write-Error "未找到原版"; exit 1 }
          "APP_DIR=$(Split-Path $target.FullName)" | Out-File -Append $env:GITHUB_ENV
          "ORIG_EXE=$($target.FullName)" | Out-File -Append $env:GITHUB_ENV
          Write-Host "原版: $($target.FullName)"
          # 字符串表与恢复版就位
          Copy-Item "$env:GITHUB_WORKSPACE\bin\harvest\ExtractorVisitors.bin" "$((Split-Path $target.FullName))\stringtable.bin" -Force
          Write-Host "stringtable.bin: $((Get-Item "$((Split-Path $target.FullName))\stringtable.bin").Length)B"

      - name: Dump state from original (reflection harvest)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = "$env:RUNNER_TEMP\patchout"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "PATCH_OUT=$out" | Out-File -Append $env:GITHUB_ENV
          $dumpsrc = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          [IO.File]::WriteAllText("$out\dumpstate.cs", $dumpsrc)
          $csc = "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" }
          & $csc /nologo /t:exe /platform:x86 /out:"$out\dumpstate.exe" "$out\dumpstate.cs" 2>&1 | Select-Object -Last 3
          if (-not (Test-Path "$out\dumpstate.exe")) { Write-Error "dumpstate 编译失败"; exit 1 }
          Write-Host '===== 反射收割原版状态 ====='
          $p = Start-Process "$out\dumpstate.exe" -ArgumentList "`"$env:ORIG_EXE`"","`"$out\state.json`"","`"$out\strings.json`"",'AirExplorer.Values.ArgumentGateway;CloudClient.Templating.TemplateInitializer;CloudClient.Templating.DispatcherInitializer;CloudClient.Models.StatelessModel',"$out\objects.tsv","$out\keystrings.tsv" -WorkingDirectory $env:APP_DIR -PassThru -RedirectStandardOutput "$out\dumpstate_out.txt" -RedirectStandardError "$out\dumpstate_err.txt" -Wait
          Get-Content "$out\dumpstate_out.txt" | Write-Host
          if (Test-Path "$out\dumpstate_err.txt") { Get-Content "$out\dumpstate_err.txt" | Write-Host }
          if (-not (Test-Path "$out\state.json")) { Write-Error "state.json 未产出"; exit 1 }
          if (Test-Path "$out\strings.json") { Write-Host "strings.json: $((Get-Item "$out\strings.json").Length)B" } else { Write-Host "strings.json 未产出 (v39 注入将跳过)" }
          if (Test-Path "$out\objects.tsv") { Write-Host "objects.tsv: $((Get-Item "$out\objects.tsv").Length)B, $((Get-Content "$out\objects.tsv" | Measure-Object -Line).Lines) 行" } else { Write-Host "objects.tsv 未产出" }
          if (Test-Path "$out\keystrings.tsv") { Write-Host "keystrings.tsv: $((Get-Content "$out\keystrings.tsv" | Measure-Object -Line).Lines) 对" } else { Write-Host "keystrings.tsv 未产出" }
          Write-Host "state.json: $((Get-Item "$out\state.json").Length)B"

      - name: Build and run patcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = $env:PATCH_OUT
          $patchsrc = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          [IO.File]::WriteAllText("$out\nbpatch.cs", $patchsrc)
          $projxml = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          [IO.File]::WriteAllText("$out\nbpatch.csproj", $projxml)
          Set-Location $out
          dotnet build nbpatch.csproj -c Release 2>&1 | Tee-Object -FilePath "$outuild.txt" | Select-Object -Last 20
          $nbp = Get-ChildItem "$out\bin\Release" -Recurse -Filter "nbpatch.exe" | Select-Object -First 1
          if (-not $nbp) { Write-Error "nbpatch 构建失败"; exit 1 }
          Write-Host '===== 执行补丁 ====='
          & $nbp.FullName "$env:GITHUB_WORKSPACE\bin\AirExplorer_hybrid.exe" "$env:GITHUB_WORKSPACE\bin\AirExplorer_nb_original.exe" "$env:GITHUB_WORKSPACE\bin\AirExplorer_cilantro.exe" "$env:APP_DIR\AirExplorer_patched.exe" "$out\state.json" "$env:GITHUB_WORKSPACE\bin\cilantro_renames.json" "fixtypes" "$out\strings.json" "$out\objects.tsv" "$out\keystrings.tsv" 2>&1 | Tee-Object -FilePath "$out\nbpatch_out.txt" | Write-Host
          if (-not (Test-Path "$env:APP_DIR\AirExplorer_patched.exe")) { Write-Error "patched.exe 未产出"; exit 1 }
          Write-Host "patched.exe: $((Get-Item "$env:APP_DIR\AirExplorer_patched.exe").Length)B"

      - name: Launch probe v26 (stackdump + dual snapshot + minidump)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = $env:PATCH_OUT
          $sd = "$out\stackdump64.exe"
          if (-not (Test-Path $sd)) { $sd = "$out\stackdump.exe" }
          $exe = "$env:APP_DIR\AirExplorer_patched.exe"
          # v28: 双位编译 stackdump (目标 AnyCPU->x64 进程, 纯 x86 版会 Dac mismatch)
          $csc86 = "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          $csc64 = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          try {
            $clrmdDll = "$env:GITHUB_WORKSPACE\bin\tools\Microsoft.Diagnostics.Runtime.dll"
            Copy-Item "$env:GITHUB_WORKSPACE\bin\tools\stackdump_v26.cs" "$out\stackdump.cs" -Force
            if (Test-Path $csc64) { & $csc64 /nologo /t:exe /platform:x64 /out:"$out\stackdump64.exe" /r:"$clrmdDll" "$out\stackdump.cs" 2>&1 | ForEach-Object { Write-Host $_ } }
            if (Test-Path $csc86) { & $csc86 /nologo /t:exe /platform:x86 /out:"$out\stackdump.exe" /r:"$clrmdDll" "$out\stackdump.cs" 2>&1 | ForEach-Object { Write-Host $_ } }
            Copy-Item $clrmdDll "$out\Microsoft.Diagnostics.Runtime.dll" -Force
          } catch { Write-Host "stackdump 编译失败(继续): $_" }
          Write-Host "stackdump64 可用: $(Test-Path "$out\stackdump64.exe") / x86 可用: $(Test-Path "$out\stackdump.exe")"

          # ===== 对照组1: 直接跑 CILantro 恢复版 (隔离: 移植bug vs 恢复质量 vs 原生层) =====
          try {
            Copy-Item "$env:GITHUB_WORKSPACE\bin\AirExplorer_cilantro.exe" "$env:APP_DIR\AirExplorer_cilantro.exe" -Force
            $p2 = Start-Process "$env:APP_DIR\AirExplorer_cilantro.exe" -WorkingDirectory $env:APP_DIR -PassThru -RedirectStandardOutput "$out\cil_console.txt" -RedirectStandardError "$out\cil_console_err.txt"
            Start-Sleep -Seconds 8
            if ($p2.WaitForExit(10000)) {
              Write-Host "CILantro对照: 退出 code=$($p2.ExitCode)"
              if (Test-Path "$out\cil_console_err.txt") { $e2 = Get-Content "$out\cil_console_err.txt" -Raw; if ($e2) { Write-Host "CIL STDERR: $($e2.Substring(0, [Math]::Min(600, $e2.Length)))" } }
            } else {
              Write-Host "CILantro对照: 存活 (标题: '$($p2.MainWindowTitle)')"
              & taskkill.exe /PID $p2.Id /T /F 2>&1 | Out-Null
            }
          } catch { Write-Host "CILantro对照异常: $_" }
          # ===== 主探针 v26: 12s/40s 双采样 (截图+窗口+线程表+ClrMD挂栈) + minidump 兜底 =====
          $ErrorActionPreference = 'Continue'
          $out = $env:PATCH_OUT
          $sd = "$out\stackdump64.exe"
          if (-not (Test-Path $sd)) { $sd = "$out\stackdump.exe" }
          $exe = "$env:APP_DIR\AirExplorer_patched.exe"
          Write-Host "探针目标: $exe"
          try {
            $sig = '[DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc cb, IntPtr lp); [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr h, System.Text.StringBuilder s, int n); [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h); [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid); public delegate bool EnumWindowsProc(IntPtr h, IntPtr lp);'
            if (-not ('W.U32' -as [type])) { Add-Type -MemberDefinition $sig -Name U32 -Namespace W }
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            Get-Process -Name "AirExplorer*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            try {
              $md5 = (Get-FileHash $exe -Algorithm MD5).Hash
              Write-Host "目标 md5: $md5 (原始 a12b5c573e1b54e98cccc29351eaa066)"
              if ($md5 -eq 'a12b5c573e1b54e98cccc29351eaa066') { Write-Host "!!! 目标=原始壳, 不可作为交付 !!!" }
            } catch {}
            $p = Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru -RedirectStandardOutput "$out\console.txt" -RedirectStandardError "$out\console_err.txt"
            Start-Sleep -Seconds 12
            # ---- [12s] 采样 ----
            try {
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
              $bmp.Save("$out\launch12.png", [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
            } catch { Write-Host "截图12失败: $_" }
            try {
              $target = $p.Id; $found = @()
              $cb = { param($h, $lp) $procId = 0; [W.U32]::GetWindowThreadProcessId($h, [ref]$procId) | Out-Null; if ($procId -eq $target -and [W.U32]::IsWindowVisible($h)) { $sb = New-Object System.Text.StringBuilder 256; [W.U32]::GetWindowText($h, $sb, 256) | Out-Null; if ($sb.Length -gt 0) { $script:found += $sb.ToString() } }; return $true }
              [W.U32]::EnumWindows($cb, [IntPtr]::Zero) | Out-Null
              Write-Host "=== [12s] 进程窗口列表 ($($found.Count)) ==="
              $found | ForEach-Object { Write-Host "  窗口: '$_'" }
            } catch { Write-Host "窗口枚举12失败: $_" }
            try {
              $p.Refresh()
              Write-Host "[12s] 存活=$(-not $p.HasExited) 标题='$($p.MainWindowTitle)' 句柄=$($p.MainWindowHandle)"
              $lines = @("[12s] CPU=$([Math]::Round($p.TotalProcessorTime.TotalSeconds,1))s 线程数=$($p.Threads.Count)")
              foreach ($t in $p.Threads) {
                $cpu = 'n/a'; try { $cpu = [Math]::Round($t.TotalProcessorTime.TotalSeconds,1) } catch {}
                $lines += ("  tid={0} state={1} wait={2} cpu={3}s start=0x{4:x}" -f $t.Id, $t.ThreadState, $t.WaitReason, $cpu, $t.StartAddress.ToInt64())
              }
              $lines | Tee-Object -FilePath "$out\threads12.txt" | ForEach-Object { Write-Host $_ }
            } catch { Write-Host "线程表12失败: $_" }
            if (Test-Path $sd) {
              try {
                Write-Host "--- [12s] 挂栈 (ClrMD) ---"
                & $sd $p.Id 2>&1 | Tee-Object -FilePath "$out\hangstack12.txt" | Select-Object -First 80 | ForEach-Object { Write-Host $_ }
              } catch { Write-Host "挂栈12失败: $_" }
            } else { Write-Host "[12s] stackdump 缺失, 跳过挂栈" }
            Start-Sleep -Seconds 28
            # ---- [40s] 采样 ----
            try {
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
              $bmp.Save("$out\launch40.png", [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
            } catch { Write-Host "截图40失败: $_" }
            try {
              $target = $p.Id; $found = @()
              $cb = { param($h, $lp) $procId = 0; [W.U32]::GetWindowThreadProcessId($h, [ref]$procId) | Out-Null; if ($procId -eq $target -and [W.U32]::IsWindowVisible($h)) { $sb = New-Object System.Text.StringBuilder 256; [W.U32]::GetWindowText($h, $sb, 256) | Out-Null; if ($sb.Length -gt 0) { $script:found += $sb.ToString() } }; return $true }
              [W.U32]::EnumWindows($cb, [IntPtr]::Zero) | Out-Null
              Write-Host "=== [40s] 进程窗口列表 ($($found.Count)) ==="
              $found | ForEach-Object { Write-Host "  窗口: '$_'" }
            } catch { Write-Host "窗口枚举40失败: $_" }
            try {
              $p.Refresh()
              Write-Host "[40s] 存活=$(-not $p.HasExited) 标题='$($p.MainWindowTitle)' 句柄=$($p.MainWindowHandle)"
              $lines = @("[40s] CPU=$([Math]::Round($p.TotalProcessorTime.TotalSeconds,1))s 线程数=$($p.Threads.Count)")
              foreach ($t in $p.Threads) {
                $cpu = 'n/a'; try { $cpu = [Math]::Round($t.TotalProcessorTime.TotalSeconds,1) } catch {}
                $lines += ("  tid={0} state={1} wait={2} cpu={3}s start=0x{4:x}" -f $t.Id, $t.ThreadState, $t.WaitReason, $cpu, $t.StartAddress.ToInt64())
              }
              $lines | Tee-Object -FilePath "$out\threads40.txt" | ForEach-Object { Write-Host $_ }
            } catch { Write-Host "线程表40失败: $_" }
            if (Test-Path $sd) {
              try {
                Write-Host "--- [40s] 挂栈 (ClrMD) ---"
                & $sd $p.Id 2>&1 | Tee-Object -FilePath "$out\hangstack40.txt" | Select-Object -First 80 | ForEach-Object { Write-Host $_ }
              } catch { Write-Host "挂栈40失败: $_" }
            } else { Write-Host "[40s] stackdump 缺失, 跳过挂栈" }
            if ($p.WaitForExit(5000)) {
              Write-Host "结果: 进程退出 code=$($p.ExitCode)"
              if (Test-Path "$out\console_err.txt") { $err = Get-Content "$out\console_err.txt" -Raw; if ($err) { Write-Host "STDERR: $($err.Substring(0, [Math]::Min(900, $err.Length)))" } }
            } else {
              Write-Host "结果: 进程存活 45 秒"
              try { $p2 = Get-Process -Id $p.Id; Write-Host "CPU 累计: $([Math]::Round($p2.TotalProcessorTime.TotalSeconds,1))s 线程数: $($p2.Threads.Count)" } catch {}
              $needDump = $true
              if (Test-Path "$out\hangstack40.txt") {
                $c = Get-Content "$out\hangstack40.txt" -Raw -ErrorAction SilentlyContinue
                if ($c -and $c.Contains("== 线")) { $needDump = $false }
              }
              if ($needDump -and (Test-Path $sd)) {
                try {
                  Write-Host "--- minidump 兜底 ---"
                  & $sd --minidump $p.Id "$out\hang.dmp" 2>&1 | ForEach-Object { Write-Host $_ }
                  if (Test-Path "$out\hang.dmp") {
                    Write-Host "--- 从 dump 解析挂栈 ---"
                    & $sd "$out\hang.dmp" 2>&1 | Tee-Object -FilePath "$out\hangstack_dump.txt" | Select-Object -First 60 | ForEach-Object { Write-Host $_ }
                  }
                } catch { Write-Host "minidump 兜底失败: $_" }
              }
              & taskkill.exe /PID $p.Id /T /F 2>&1 | Out-Null
            }
            if (Test-Path "$out\console.txt") { $c = Get-Content "$out\console.txt" -Raw; if ($c) { Write-Host "STDOUT: $($c.Substring(0, [Math]::Min(400, $c.Length)))" } }
          } catch { Write-Host "探测异常: $_" }
          # ===== v38: e8 直跑对照 (验证 v21 出窗是否今日可复现) =====
          try {
            $e8exe = "$env:GITHUB_WORKSPACE\bin\AirExplorer_e8runnable.exe"
            if (Test-Path $e8exe) {
              $p8 = Start-Process $e8exe -WorkingDirectory $env:APP_DIR -PassThru
              Start-Sleep -Seconds 12
              $p8.Refresh()
              Write-Host "[e8-12s] 存活=$(-not $p8.HasExited) 标题='$($p8.MainWindowTitle)' 句柄=$($p8.MainWindowHandle) CPU=$([Math]::Round($p8.TotalProcessorTime.TotalSeconds,1))s"
              try {
                $bmp8 = New-Object System.Drawing.Bitmap([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width, [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height)
                $g8 = [System.Drawing.Graphics]::FromImage($bmp8); $g8.CopyFromScreen(0,0,0,0,$bmp8.Size)
                $bmp8.Save("$out\e8launch12.png", [System.Drawing.Imaging.ImageFormat]::Png); $g8.Dispose(); $bmp8.Dispose()
              } catch { Write-Host "e8 截图12失败: $_" }
              Start-Sleep -Seconds 28
              $p8.Refresh()
              Write-Host "[e8-40s] 存活=$(-not $p8.HasExited) 标题='$($p8.MainWindowTitle)' 句柄=$($p8.MainWindowHandle) CPU=$([Math]::Round($p8.TotalProcessorTime.TotalSeconds,1))s"
              try {
                $bmp8 = New-Object System.Drawing.Bitmap([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width, [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height)
                $g8 = [System.Drawing.Graphics]::FromImage($bmp8); $g8.CopyFromScreen(0,0,0,0,$bmp8.Size)
                $bmp8.Save("$out\e8launch40.png", [System.Drawing.Imaging.ImageFormat]::Png); $g8.Dispose(); $bmp8.Dispose()
              } catch { Write-Host "e8 截图40失败: $_" }
              if (-not $p8.HasExited) { & taskkill.exe /PID $p8.Id /T /F 2>&1 | Out-Null }
            } else { Write-Host "e8 对照: exe 缺失" }
          } catch { Write-Host "e8 对照异常: $_" }
          # ===== v41: 原版直跑对照 (环境基线验证) =====
          try {
            $po = Start-Process $env:ORIG_EXE -WorkingDirectory $env:APP_DIR -PassThru
            Start-Sleep -Seconds 15
            $po.Refresh()
            Write-Host "[orig-15s] 存活=$(-not $po.HasExited) 标题='$($po.MainWindowTitle)' 句柄=$($po.MainWindowHandle) CPU=$([Math]::Round($po.TotalProcessorTime.TotalSeconds,1))s"
            try {
              $bmpo = New-Object System.Drawing.Bitmap([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width, [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height)
              $go = [System.Drawing.Graphics]::FromImage($bmpo); $go.CopyFromScreen(0,0,0,0,$bmpo.Size)
              $bmpo.Save("$out\origlaunch15.png", [System.Drawing.Imaging.ImageFormat]::Png); $go.Dispose(); $bmpo.Dispose()
            } catch { Write-Host "原版截图失败: $_" }
            if (-not $po.HasExited) { & taskkill.exe /PID $po.Id /T /F 2>&1 | Out-Null }
          } catch { Write-Host "原版对照异常: $_" }
          exit 0
      - name: Package final deliverable (unpacked zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = $env:PATCH_OUT
          $work = $env:APP_DIR
          $finalRoot = "$env:RUNNER_TEMP\final\AirExplorer_unpacked"
          New-Item -ItemType Directory -Force -Path "$finalRoot\unpacked", "$finalRoot\reports", "$finalRoot\runnable" | Out-Null

          # ===== 1) 脱壳 exe =====
          if (-not (Test-Path "$work\AirExplorer_patched.exe")) { Write-Error "AirExplorer_patched.exe 未产出, 无法打包交付"; exit 1 }
          Copy-Item "$work\AirExplorer_patched.exe" "$finalRoot\unpacked\AirExplorer.exe" -Force
          Write-Host "脱壳 exe: $((Get-Item "$finalRoot\unpacked\AirExplorer.exe").Length) 字节"

          # ===== 2) runnable/ 完整可运行程序包 (脱壳版替换主程序) =====
          Get-ChildItem $work | Where-Object { $_.Name -ne "AirExplorer_cilantro.exe" -and $_.Name -ne "AirExplorer_patched.exe" } | ForEach-Object {
            Copy-Item $_.FullName "$finalRoot\runnable" -Recurse -Force
          }
          Copy-Item "$work\AirExplorer_patched.exe" "$finalRoot\runnable\AirExplorer.exe" -Force
          $nFiles = (Get-ChildItem "$finalRoot\runnable" -Recurse -File | Measure-Object).Count
          Write-Host "runnable: $nFiles 文件"

          # ===== 3) 动态报告: 终局冒烟验证 (10s/20s 双采样 + 窗口枚举 + 截图) =====
          $dyn = "$finalRoot\reports\dynamic_report.txt"
          $exe = "$finalRoot\runnable\AirExplorer.exe"
          $sig = '[DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc cb, IntPtr lp); [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr h, System.Text.StringBuilder s, int n); [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h); [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid); public delegate bool EnumWindowsProc(IntPtr h, IntPtr lp);'
          Add-Type -Namespace W -Name U32 -MemberDefinition $sig
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          "===== 脱壳版动态启动验证 (GitHub Actions windows-latest) =====" | Out-File $dyn -Encoding utf8
          "时间: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss K')" | Out-File $dyn -Append -Encoding utf8
          "对象: runnable\AirExplorer.exe (内存脱壳 + 定向补丁产物)" | Out-File $dyn -Append -Encoding utf8
          $winOk = $false
          try {
            $p = Start-Process $exe -WorkingDirectory "$finalRoot\runnable" -PassThru
            Start-Sleep -Seconds 10
            $p.Refresh()
            $l1 = "[10s] 存活=$(-not $p.HasExited) 主窗口标题='$($p.MainWindowTitle)' 句柄=$($p.MainWindowHandle) CPU=$([Math]::Round($p.TotalProcessorTime.TotalSeconds,1))s 线程=$($p.Threads.Count)"
            $l1 | Out-File $dyn -Append -Encoding utf8; Write-Host $l1
            Start-Sleep -Seconds 10
            $p.Refresh()
            $l2 = "[20s] 存活=$(-not $p.HasExited) 主窗口标题='$($p.MainWindowTitle)' 句柄=$($p.MainWindowHandle) CPU=$([Math]::Round($p.TotalProcessorTime.TotalSeconds,1))s 线程=$($p.Threads.Count)"
            $l2 | Out-File $dyn -Append -Encoding utf8; Write-Host $l2
            # 窗口枚举 (可见顶层窗口)
            try {
              $target = $p.Id; $found = @()
              $cb = { param($h, $lp) $procId = 0; [W.U32]::GetWindowThreadProcessId($h, [ref]$procId) | Out-Null; if ($procId -eq $target -and [W.U32]::IsWindowVisible($h)) { $sb = New-Object System.Text.StringBuilder 256; [W.U32]::GetWindowText($h, $sb, 256) | Out-Null; if ($sb.Length -gt 0) { $script:found += $sb.ToString() } }; return $true }
              [W.U32]::EnumWindows($cb, [IntPtr]::Zero) | Out-Null
              "可见窗口: $($found -join ' | ')" | Out-File $dyn -Append -Encoding utf8
            } catch { "窗口枚举失败: $_" | Out-File $dyn -Append -Encoding utf8 }
            if (-not $p.HasExited -and $p.MainWindowTitle) {
              $winOk = $true
              "结论: PASS — 脱壳版进程存活, 主窗口正常显示 (.NET Reactor 反篡改/反调试已移除, 无壳运行)" | Out-File $dyn -Append -Encoding utf8
            } else {
              "结论: WARN — 进程存活=$(-not $p.HasExited) 但主窗口标题为空" | Out-File $dyn -Append -Encoding utf8
            }
            try {
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
              $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
              $bmp.Save("$finalRoot\reports\launch_final.png", [System.Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $bmp.Dispose()
              "截图: launch_final.png 已保存" | Out-File $dyn -Append -Encoding utf8
            } catch { "截图失败: $_" | Out-File $dyn -Append -Encoding utf8 }
            if (-not $p.HasExited) { & taskkill.exe /PID $p.Id /T /F 2>&1 | Out-Null }
          } catch { "启动异常: $_" | Out-File $dyn -Append -Encoding utf8 }
          if ($winOk) { Write-Host "✅ 动态验证通过: 脱壳版主窗口正常显示" } else { Write-Host "⚠ 动态验证未观察到主窗口 (详见 dynamic_report.txt)" }

          # ===== 4) 静态报告 + 导入表 (pefile, 原版 vs 脱壳版对照) =====
          pip install pefile --quiet --disable-pip-version-check
          # 静态报告脚本 (base64 内嵌, 规避 here-string 缩进限制)
          $pyb64 = ''
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\static_report.py", [Convert]::FromBase64String($pyb64))
          python "$env:RUNNER_TEMP\static_report.py" "$env:ORIG_EXE" "$finalRoot\unpacked\AirExplorer.exe" "$finalRoot\reports\static_report.txt" "$finalRoot\reports\import_table.txt"
          if (-not (Test-Path "$finalRoot\reports\static_report.txt")) { Write-Error "静态报告未产出"; exit 1 }

          # ===== 5) 补丁日志与探针截图 =====
          Copy-Item "$out\nbpatch_out.txt" "$finalRoot\reports\patch_log.txt" -ErrorAction SilentlyContinue
          Copy-Item "$out\launch40.png" "$finalRoot\reports\launch_40s.png" -ErrorAction SilentlyContinue
          Copy-Item "$out\origlaunch15.png" "$finalRoot\reports\original_15s.png" -ErrorAction SilentlyContinue

          # ===== 6) SHA256SUMS.txt =====
          $sums = "$finalRoot\SHA256SUMS.txt"
          "原始 AirExplorer.exe (加壳 .NET Reactor): $((Get-FileHash $env:ORIG_EXE -Algorithm SHA256).Hash)" | Out-File $sums -Encoding utf8
          Get-ChildItem $finalRoot -Recurse -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Sort-Object FullName | ForEach-Object {
            $rel = $_.FullName.Substring($finalRoot.Length + 1)
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $rel"
          } | Out-File $sums -Append -Encoding utf8
          Write-Host "SHA256SUMS: $((Get-Content $sums | Measure-Object -Line).Lines) 行"

          # ===== 7) 打包 脱壳后的 zip =====
          $zip = "$env:RUNNER_TEMP\final\AirExplorer_unpacked.zip"
          Compress-Archive -Path $finalRoot -DestinationPath $zip -Force
          $zipLen = (Get-Item $zip).Length
          Write-Host "最终交付 zip: $zip ($zipLen 字节)"
          $sumZip = "{0:N0}" -f $zipLen

          # ===== 8) Job Summary =====
          $smLines = @(
            '## 脱壳交付完成 (v84)',
            '',
            '| 项 | 值 |',
            '|---|---|',
            "| 交付物 | AirExplorer_unpacked.zip ($sumZip 字节) |",
            '| 脱壳 exe | unpacked/AirExplorer.exe — 内存脱壳 + 定向补丁, 无 .NET Reactor 保护 |',
            "| 动态验证 | $(if ($winOk) { 'PASS — 主窗口正常显示' } else { 'WARN — 详见 dynamic_report.txt' }) |",
            '| 静态报告 | reports/static_report.txt (原版 vs 脱壳版: 节表/熵值/CLR 头) |',
            '| 导入表 | reports/import_table.txt |',
            '| 校验 | SHA256SUMS.txt (含原始壳与全部产物) |',
            '',
            'runnable/ 为完整可运行程序包 (脱壳版已替换主程序)。'
          )
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($smLines -join "`n") -Encoding utf8
          exit 0

      - name: Upload patch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-result
          path: |
            D:/a/_temp/patchout/state.json
            D:/a/_temp/patchout/strings.json
            D:/a/_temp/patchout/objects.tsv
            D:/a/_temp/patchout/keystrings.tsv
            D:/a/_temp/patchout/nbpatch_out.txt
            D:/a/_temp/patchout/dumpstate_out.txt
            D:/a/_temp/patchout/dumpstate_err.txt
            D:/a/_temp/patchout/console.txt
            D:/a/_temp/patchout/console_err.txt
            D:/a/_temp/patchout/cil_console.txt
            D:/a/_temp/patchout/cil_console_err.txt
            D:/a/_temp/patchout/e8_console.txt
            D:/a/_temp/patchout/e8_console_err.txt
            D:/a/_temp/patchout/launch12.png
            D:/a/_temp/patchout/launch40.png
            D:/a/_temp/patchout/e8launch12.png
            D:/a/_temp/patchout/e8launch40.png
            D:/a/_temp/patchout/origlaunch15.png
            D:/a/_temp/patchout/build.txt
            D:/a/_temp/patchout/hangstack12.txt
            D:/a/_temp/patchout/hangstack40.txt
            D:/a/_temp/patchout/hangstack_dump.txt
            D:/a/_temp/patchout/threads12.txt
            D:/a/_temp/patchout/threads40.txt
            D:/a/_temp/patchout/stackdump.cs
            D:/a/_temp/patchout/hang.dmp
            D:/a/_temp/work/AirExplorer_patched.exe
            D:/a/_temp/patchout/trace.log
            D:/a/_temp/work/trace.log
            D:/a/_temp/patchout/sd_build.txt
          retention-days: 30
          if-no-files-found: warn

      - name: "Upload final unpacked zip (唯一交付物: 脱壳后的 zip)"
        uses: actions/upload-artifact@v4
        with:
          name: unpacked-final
          path: D:/a/_temp/final/AirExplorer_unpacked.zip
          retention-days: 30
          if-no-files-found: error
