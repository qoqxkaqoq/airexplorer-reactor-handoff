# .github/workflows/ar_file.yml
# AutoReaktor 单文件并行链: 一次 dispatch 只跑一个目标文件
# 改造自 autoreaktor.yml —— 串行全目录模式的 85 分钟预算被 21 个程序集摊薄,
# KRBTabControl.dll 排队到队尾被超时截杀 (run 39217550487)。
# 单文件模式: 每个目标独占一个 Windows runner + 100 分钟预算, 3 个 dispatch 并行。
# v2: unzip shim 免疫化 (无花括号/无 >&2/全 CR 剥除/bash -n 自检+极简兜底)。
#     注意: here-string 正文必须带 10 空格缩进 (YAML 剥离后归零), 顶格会破坏 YAML。
name: AutoReaktor Single File

on:
  workflow_dispatch:
    inputs:
      target_file:
        description: '单个目标文件名 (exe 或 dll)'
        required: true
        default: 'KRBTabControl.dll'
      source_zip:
        description: '源压缩包文件名（repo 根目录）'
        required: true
        default: '1.zip'

jobs:
  ar-file:
    name: AR 单文件 - ${{ github.event.inputs.target_file }}
    runs-on: windows-latest
    timeout-minutes: 115
    env:
      AR_REPO: D:\a\ar\repo
      WORK_DIR: D:\a\ar\work
      AR_OUT: D:\a\ar\out
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Clone AutoReaktor and fetch tools
        shell: pwsh
        timeout-minutes: 15
        run: |
          git clone --depth 1 https://github.com/0301091405/autoreaktor.git "$env:AR_REPO"
          if ($LASTEXITCODE -ne 0) { Write-Error '克隆 autoreaktor 失败'; exit 1 }
          # git-bash 无 unzip (setup.sh 依赖) — 提供 bsdtar 兜底 shim
          # v2 免疫化: 无花括号、无 >&2, 全 CR 剥除, bash -n 自检失败则退化为极简版
          $shimDir = "$env:RUNNER_TEMP\shim"
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
          $shimBody = @'
          #!/usr/bin/env bash
          # unzip shim subset for setup.sh (unzip -o file.zip -d dir)
          set -e
          z=""
          d="."
          while [ "$#" -gt 0 ]; do
            if [ "$1" = "-d" ]; then
              d="$2"
              shift 2
            else
              if [ "$1" = "-o" ] || [ "${1:0:1}" = "-" ]; then
                shift
              else
                if [ -z "$z" ]; then
                  z="$1"
                fi
                shift
              fi
            fi
          done
          if [ -z "$z" ]; then
            echo "unzip-shim: no archive given"
            exit 1
          fi
          mkdir -p "$d"
          exec /c/Windows/System32/tar.exe -xf "$z" -C "$d"
          '@
          # 剥除所有 CR (CRLF 或孤立 CR 都归一为 LF)
          $shimBody = $shimBody -replace "`r", ""
          $shimBody = $shimBody.TrimStart() -replace "`n          ", "`n"
          $shimBody = $shimBody.TrimEnd()
          [IO.File]::WriteAllText("$shimDir\unzip", $shimBody + "`n")
          Write-Host "unzip shim 就绪: $shimDir"
          # bash 侧路径转换 (C:\x\y -> /c/x/y)
          $shimPosix = ('/' + $shimDir.Substring(0,1).ToLower() + $shimDir.Substring(2)).Replace('\','/')
          Write-Host "shim posix path: $shimPosix"
          # 语法自检: 失败则退化为极简 shim (假定 -o file -d dir 调用序)
          bash -n "$shimPosix/unzip" 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Host '主 shim 语法检查失败, 写入极简兜底 shim'
            $tiny = @'
          #!/usr/bin/env bash
          set -e
          exec /c/Windows/System32/tar.exe -xf "$2" -C "$4"
          '@
            $tiny = ($tiny -replace "`r", "").TrimStart() -replace "`n          ", "`n"
            $tiny = $tiny.TrimEnd()
            [IO.File]::WriteAllText("$shimDir\unzip", $tiny + "`n")
            bash -n "$shimPosix/unzip" 2>&1 | Write-Host
            if ($LASTEXITCODE -ne 0) { Write-Error 'unzip shim 完全无法构建'; exit 1 }
          }
          Write-Host 'shim 语法自检通过'
          $bashCmd = "chmod +x `"$shimPosix/unzip`" 2>/dev/null; export PATH=`"$shimPosix`":`$PATH; export DE4DOT_URL=`"https://github.com/GDATAAdvancedAnalytics/de4dotEx/releases/download/3.11.0/de4dotEx-3.11.0-net48.zip`"; cd `"$env:AR_REPO`" && bash tools/setup.sh"
          bash -c $bashCmd
          if ($LASTEXITCODE -ne 0) { Write-Error 'setup.sh 失败'; exit 1 }
          Write-Host 'AutoReaktor 工具链就绪'

      - name: Extract app from source zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:WORK_DIR","$env:AR_OUT" | Out-Null
          $src = Join-Path $env:GITHUB_WORKSPACE "${{ github.event.inputs.source_zip }}"
          if (-not (Test-Path $src)) { Write-Error "源压缩包不存在"; exit 1 }
          Expand-Archive -Path $src -DestinationPath "$env:WORK_DIR" -Force
          $target = Get-ChildItem $env:WORK_DIR -Recurse -File -Filter "${{ github.event.inputs.target_file }}" | Select-Object -First 1
          if (-not $target) { Write-Error "未找到目标: ${{ github.event.inputs.target_file }}"; exit 1 }
          "TARGET_PATH=$($target.FullName)" | Out-File -Append $env:GITHUB_ENV
          "TARGET_NAME=$($target.Name)" | Out-File -Append $env:GITHUB_ENV
          "APP_DIR=$(Split-Path $target.FullName)" | Out-File -Append $env:GITHUB_ENV
          Write-Host "目标: $($target.FullName)"

      - name: Run AutoReaktor chain on single file (Slayer → Krypton → NecroBit JIT)
        shell: pwsh
        timeout-minutes: 100
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Location "$env:AR_REPO"
          # 单文件模式: 只处理 TARGET_PATH, 不再串行整个目录 (v1 的 85 分钟超时根因)
          python -u autoreaktor.py "$env:TARGET_PATH" --deep --keep-work 2>&1 | Tee-Object -FilePath "$env:AR_OUT\autoreaktor_stdout.txt"
          Write-Host "退出码: $LASTEXITCODE"
          $rp = "$env:WORK_DIR\_ar_out\report.json"
          if (Test-Path $rp) {
            Copy-Item $rp "$env:AR_OUT\report.json" -Force
            try {
              $rep = Get-Content $rp -Raw | ConvertFrom-Json
              Write-Host '===== AutoReaktor 结果汇总 ====='
              foreach ($e in $rep.files) {
                Write-Host ("{0}  ->  {1}" -f $e.input, $e.result)
                if ($e.runnable_output) { Write-Host ("    runnable: {0}" -f $e.runnable_output) }
              }
            } catch { Write-Host "report 解析失败: $_" }
          } else {
            Write-Host '未生成 report.json (链条中断或超时)'
          }

      - name: Package AutoReaktor output
        if: always()
        shell: pwsh
        timeout-minutes: 10
        run: |
          $arout = "$env:WORK_DIR\_ar_out"
          if (-not (Test-Path $arout)) { Write-Host '无 _ar_out'; exit 0 }
          $zip = "$env:AR_OUT\autoreaktor_result.zip"
          $sz7 = 'C:\Program Files\7-Zip\7z.exe'
          if (Test-Path $sz7) {
            & $sz7 a -tzip $zip "$arout\*" | Out-Null
          } else {
            tar -a -cf $zip -C $arout .
          }
          if (Test-Path $zip) { Write-Host ("打包: {0} ({1:N0} bytes)" -f $zip, (Get-Item $zip).Length) } else { Write-Host '打包失败' }

      - name: Upload AutoReaktor result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar-file-result
          path: |
            D:/a/ar/out/autoreaktor_result.zip
            D:/a/ar/out/report.json
            D:/a/ar/out/autoreaktor_stdout.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Smoke test rebuilt exe (15s, 仅 exe 目标)
        if: always()
        shell: pwsh
        timeout-minutes: 5
        run: |
          New-Item -ItemType Directory -Force -Path "$env:AR_OUT" | Out-Null
          if (-not $env:TARGET_NAME) { Write-Host 'TARGET_NAME 未设置 (前序步骤失败), 跳过冒烟'; 'SKIPPED-NO-TARGET' | Out-File "$env:AR_OUT\smoke_result.txt" -Encoding utf8; exit 0 }
          if ($env:TARGET_NAME -notmatch '\.exe$') {
            Write-Host "目标是库文件 ($env:TARGET_NAME), 跳过启动冒烟"
            "SKIP-DLL ($env:TARGET_NAME)" | Out-File "$env:AR_OUT\smoke_result.txt" -Encoding utf8
            exit 0
          }
          $rp = "$env:AR_OUT\report.json"
          if (-not (Test-Path $rp)) { $rp = "$env:WORK_DIR\_ar_out\report.json" }
          if (-not (Test-Path $rp)) { Write-Host '无 report.json, 跳过冒烟'; 'NO-REPORT' | Out-File "$env:AR_OUT\smoke_result.txt" -Encoding utf8; exit 0 }
          $rep = Get-Content $rp -Raw | ConvertFrom-Json
          $cands = @($rep.files | Where-Object { $_.runnable_output -and (Test-Path $_.runnable_output) })
          if ($cands.Count -eq 0) { Write-Host '无 runnable 产物, 跳过冒烟'; 'NO-RUNNABLE' | Out-File "$env:AR_OUT\smoke_result.txt" -Encoding utf8; exit 0 }
          $pri = @{ 'run-recovered' = 0; 'necrobit-recovered' = 1; 'krypton-devirt' = 2; 'slayer-clean' = 3; 'necrobit-partial' = 4 }
          $best = $cands | Sort-Object { if ($pri.ContainsKey($_.result)) { $pri[$_.result] } else { 99 } } | Select-Object -First 1
          Write-Host "冒烟对象: $($best.input) -> $($best.result): $($best.runnable_output)"
          $test = "$env:RUNNER_TEMP\arsmoke"
          if (Test-Path $test) { Remove-Item $test -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $test | Out-Null
          Copy-Item -Path "$env:APP_DIR\*" -Destination $test -Recurse -Force
          foreach ($e in @($rep.files)) {
            if ($e.runnable_output -and (Test-Path $e.runnable_output)) {
              $name = Split-Path $e.input -Leaf
              Copy-Item $e.runnable_output (Join-Path $test $name) -Force
              Write-Host "替换: $name <- $($e.runnable_output)"
            }
          }
          $exe = Join-Path $test $env:TARGET_NAME
          Get-Process -Name ([IO.Path]::GetFileNameWithoutExtension($env:TARGET_NAME)) -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $p = Start-Process $exe -WorkingDirectory $test -PassThru
          if ($p.WaitForExit(15000)) {
            Write-Host "SMOKE RESULT: FAIL (启动后退出, code=$($p.ExitCode))"
            "FAIL code=$($p.ExitCode) ($($best.result))" | Out-File "$env:AR_OUT\smoke_result.txt" -Encoding utf8
          } else {
            Write-Host 'SMOKE RESULT: PASS (进程持续存活15秒)'
            "PASS ($($best.result))" | Out-File "$env:AR_OUT\smoke_result.txt" -Encoding utf8
          }
          & taskkill.exe /PID $p.Id /T /F 2>&1 | Out-Null
          Start-Sleep -Seconds 1
          Get-Process -Name ([IO.Path]::GetFileNameWithoutExtension($env:TARGET_NAME)) -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'msedgewebview2' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$($env:RUNNER_TEMP)*" } | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar-file-smoke-result
          path: D:/a/ar/out/smoke_result.txt
          retention-days: 90
          if-no-files-found: warn
